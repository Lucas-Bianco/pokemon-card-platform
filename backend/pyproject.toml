[project]
name = "cardplatform"
version = "0.1.0"
description = "Local-first Pokemon card recognition and valuation platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    # Phase 3c alerts: Web Push delivery (VAPID). Pulls py-vapid (used by the
    # gen-vapid CLI to generate keypairs) and http-ece for payload encryption.
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "respx>=0.21"]
# Recognition stack (Phase 1a). Kept out of base dependencies so the CLI and API
# stay installable without a multi-gigabyte ML install.
#
# IMPORTANT: installing this group pulls torch from PyPI, which REPLACES a CUDA
# build with a CPU-only one. After installing, always re-run:
#   pip install --force-reinstall torch torchvision --index-url https://download.pytorch.org/whl/cu128
# torch and torchvision must come from that index together, or torchvision fails
# with "operator torchvision::nms does not exist".
ml = [
    "open-clip-torch>=2.24",
    "faiss-cpu>=1.8",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "numpy>=2.0",
    "rapidocr-onnxruntime>=1.3",
    "python-multipart>=0.0.9",
]

[project.scripts]
cardplatform = "cardplatform.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
